name: Leaderboard consistency

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # ts-node resolves @aniquizz/database and @aniquizz/shared from dist/.
      - name: Build workspace packages the report imports
        run: pnpm exec turbo run build --filter=@aniquizz/shared --filter=@aniquizz/database

      # GitHub-hosted runners have no IPv6. db.<ref>.supabase.co is IPv6-only for this
      # project, so Prisma fails before the query. The session pooler is IPv4.
      - name: Point Prisma at the IPv4 session pooler
        run: |
          python3 - << 'PY'
          import os
          from urllib.parse import parse_qsl, quote, urlencode, urlparse, urlunparse

          raw = os.environ.get("DATABASE_URL", "")
          parsed = urlparse(raw)
          host = parsed.hostname or ""
          pooler = "aws-1-eu-west-1.pooler.supabase.com"
          project_ref = "qjnfdhmvvledhtwwfrzb"

          if host == pooler:
              print("DATABASE_URL already uses the session pooler")
              raise SystemExit(0)

          expected = f"db.{project_ref}.supabase.co"
          if host != expected:
              print(f"Refusing to rewrite unexpected database host: {host or '(missing)'}")
              raise SystemExit(1)

          user = parsed.username or "postgres"
          if user == "postgres":
              user = f"postgres.{project_ref}"
          query = dict(parse_qsl(parsed.query, keep_blank_values=True))
          query.setdefault("sslmode", "require")
          netloc = (
              f"{quote(user, safe='')}:{quote(parsed.password or '', safe='')}"
              f"@{pooler}:5432"
          )
          rewritten = urlunparse(
              (
                  parsed.scheme or "postgresql",
                  netloc,
                  parsed.path or "/postgres",
                  "",
                  urlencode(query),
                  "",
              )
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("DATABASE_URL<<AQ_DATABASE_URL\n")
              env_file.write(rewritten)
              env_file.write("\nAQ_DATABASE_URL\n")
          print(f"Rewrote {expected} to {pooler}:5432")
          PY

      - name: Report Profile vs MatchPlayer drift
        run: pnpm --filter aniquizz-server exec ts-node scripts/report-leaderboard-consistency.ts --fail-on-drift
