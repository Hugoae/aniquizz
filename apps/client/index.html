<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#110D16" />
    <meta name="color-scheme" content="dark" />

    <title>AniQuizz - Le Blindtest d'Anime</title>
    <meta
      name="description"
      content="Blindtest anime en ligne. Devinez l'anime à partir de la musique. En solo ou à plusieurs, sans pubs et 100% gratuit !"
    />
    <meta name="author" content="AniQuizz" />
    <meta name="application-name" content="AniQuizz" />
    <meta name="apple-mobile-web-app-title" content="AniQuizz" />
    <link rel="canonical" href="https://aniquizz.com/" data-rh="true" />

    <!--
      First-paint shell — background and pulsing mark only.
      This link is replaced at build time by an inline <style> (see
      app-shell-inline-css in vite.config.ts) so the shell is styled on the
      very first paint with no extra round-trip. public/app-shell.css stays
      the single source of truth.
    -->
    <link rel="stylesheet" href="/app-shell.css" />
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin-800-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Google favicons: multiples of 48px (16/32 alone are often ignored). -->
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon.ico" />

    <meta property="og:title" content="AniQuizz - Le Blindtest d'Anime" />
    <meta
      property="og:description"
      content="Blindtest anime en ligne. Devinez l'anime à partir de la musique. En solo ou à plusieurs, sans pubs et 100% gratuit !"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="AniQuizz" />
    <meta property="og:image" content="https://aniquizz.com/android-chrome-512x512.png" />
    <meta property="og:url" content="https://aniquizz.com/" data-rh="true" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AniQuizz - Le Blindtest d'Anime" />
    <meta
      name="twitter:description"
      content="Blindtest anime en ligne. Devinez l'anime à partir de la musique. En solo ou à plusieurs, sans pubs et 100% gratuit !"
    />
    <meta name="twitter:image" content="https://aniquizz.com/android-chrome-512x512.png" />

    <!-- Static JSON-LD for crawlers (React Helmet duplicates at runtime). Keep in sync with homeJsonLd(). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://aniquizz.com/#organization",
            "name": "AniQuizz",
            "alternateName": "AniQuiz",
            "url": "https://aniquizz.com",
            "logo": {
              "@type": "ImageObject",
              "url": "https://aniquizz.com/android-chrome-512x512.png",
              "width": 512,
              "height": 512
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://aniquizz.com/#website",
            "name": "AniQuizz",
            "alternateName": ["AniQuiz", "Blindtest anime", "Blindtest d'anime", "aniquizz.com"],
            "url": "https://aniquizz.com",
            "description": "Blindtest anime en ligne. Devinez l'anime à partir de la musique. En solo ou à plusieurs, sans pubs et 100% gratuit !",
            "publisher": { "@id": "https://aniquizz.com/#organization" },
            "inLanguage": "fr-FR",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://aniquizz.com/library?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "VideoGame",
            "name": "AniQuizz",
            "alternateName": "AniQuiz",
            "url": "https://aniquizz.com",
            "description": "Blindtest anime en ligne. Devinez l'anime à partir de la musique. En solo ou à plusieurs, sans pubs et 100% gratuit !",
            "applicationCategory": "Game",
            "genre": ["Quiz", "Music"],
            "playMode": ["SinglePlayer", "MultiPlayer"],
            "operatingSystem": "Web browser",
            "inLanguage": "fr-FR",
            "isAccessibleForFree": true,
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "EUR"
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <!-- Static first paint: the real page fades in once it is styled. -->
    <div id="app-shell" aria-hidden="true">
      <div class="app-shell-mark">
        <span class="app-shell-halo"></span>
        <img src="/android-chrome-192x192.png" alt="" width="72" height="72" decoding="async" />
      </div>
    </div>

    <div id="root"></div>
    <!-- Tailwind readiness probe — `flex` only applies once the Vite CSS bundle is parsed. -->
    <div id="tw-probe" class="flex" aria-hidden="true"></div>
    <!-- Crawlable route copy for bots; kept out of #root to avoid a pre-hydrate flash. -->
    <div id="seo-content" hidden></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
