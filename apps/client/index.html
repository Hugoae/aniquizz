<!doctype html>
<html lang="fr" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#110D16" />
    <meta name="color-scheme" content="dark" />

    <title>AniQuizz</title>
    <meta name="description" content="Blindtest anime gratuit : devine l'opening ou l'ending, solo ou multijoueur, avec ta liste AniList." />
    <meta name="author" content="AniQuizz" />
    <link rel="canonical" href="https://aniquizz.com/" />

    <!-- Blocking first-paint shell — replaced seamlessly when React mounts. -->
    <link rel="stylesheet" href="/app-shell.css" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon.ico" />

    <meta property="og:title" content="AniQuizz — Blindtest anime en ligne" />
    <meta property="og:description" content="Blindtest anime gratuit : devine l'opening ou l'ending, solo ou multijoueur, avec ta liste AniList." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="AniQuizz" />
    <meta property="og:image" content="https://aniquizz.com/og-image.jpg" />
    <meta property="og:url" content="https://aniquizz.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AniQuizz — Blindtest anime en ligne" />
    <meta name="twitter:description" content="Devine l'anime à partir de son opening ou ending. Joue solo ou multijoueur !" />
    <meta name="twitter:image" content="https://aniquizz.com/og-image.jpg" />
  </head>

  <body>
    <div id="root">
      <div id="app-shell" aria-hidden="true">
        <header class="app-shell-header">
          <a class="app-shell-brand" href="/">
            <img src="/favicon-32x32.png" alt="" width="32" height="32" decoding="async" />
            <span>AniQuizz</span>
          </a>
          <div class="app-shell-auth" aria-hidden="true"></div>
        </header>
        <main class="app-shell-main">
          <div class="app-shell-eyebrow">Devine l'anime rien qu'à sa musique</div>
          <h1 class="app-shell-title">Testez votre <span>culture anime</span></h1>
          <p class="app-shell-sub">
            Devinez l'anime à partir de la musique. Défiez vos amis et prouvez que vous êtes le meilleur.
          </p>
          <div class="app-shell-cta">Jouer</div>
          <div class="app-shell-secondary">
            <span>Librairie</span>
            <span>Classement</span>
          </div>
        </main>
      </div>
    </div>
    <!-- Crawlable route copy for bots; kept out of #root to avoid a pre-hydrate flash. -->
    <div id="seo-content" hidden></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
